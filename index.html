<script>
(function () {
    // Design-ui pages are single compositions, so the whole body is editable.
    function markEditable() {
        document.body.classList.add('artifact-editable');
    }

    // Credit badge with idle-fade. Hover devices only.
    function initChromeUI() {
        if (!matchMedia('(hover: hover)').matches) return;

        var credit = document.createElement('div');
        credit.className = 'design-ui-credit';
        credit.setAttribute('aria-hidden', 'true');
        credit.innerHTML = '\u{1F49C} by ClickUp Brain';
        document.body.appendChild(credit);

        var timer = null;
        var fade = function (out) { credit.style.opacity = out ? '0' : ''; };
        fade(true);
        var show = function () {
            fade(false);
            clearTimeout(timer);
            timer = setTimeout(function () { fade(true); }, 3000);
        };
        document.addEventListener('mousemove', show);
        show();
    }

    function init() {
        markEditable();
        initChromeUI();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();

</script>

$("login").onclick=async()=>{try{await signInWithPopup(auth,provider)}catch(e){console.error(e);$("loginError").textContent="Chyba: "+e.code}};$("monthBtn").onclick=()=>{view="month";$("monthBtn").classList.add("active");$("weekBtn").classList.remove("active");render()};$("weekBtn").onclick=()=>{view="week";$("weekBtn").classList.add("active");$("monthBtn").classList.remove("active");render()};$("prev").onclick=()=>{view==="month"?cursor.setMonth(cursor.getMonth()-1):cursor.setDate(cursor.getDate()-7);render()};$("next").onclick=()=>{view==="month"?cursor.setMonth(cursor.getMonth()+1):cursor.setDate(cursor.getDate()+7);render()};$("today").onclick=()=>{cursor=new Date();render()};onAuthStateChanged(auth,u=>{if(!u){$("setup").style.display="grid";syncState("Čeká na přihlášení","error");return}$("setup").style.display="none";if(unsub)unsub();syncState("Načítám…","saving");unsub=onSnapshot(collection(db,"calendar"),s=>{data={};s.forEach(x=>{const v=x.data();data[v.key+"_"+v.field]=v.value;if(v.key==="_settings"&&v.field==="people"){try{people=JSON.parse(v.value)}catch{}}});syncState("Synchronizováno");render()},e=>{console.error(e);syncState("Synchronizace selhala","error")})});render();
