<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#75543a">
<title>Viola kalendář</title>

<style>
:root{
  --bg:#f7f2ea;--paper:#fffdf9;--ink:#2b2824;--muted:#746e65;
  --line:#ded5c9;--job:#f4dfcf;--jobline:#d19f78;
  --accent:#75543a;--note:#dff0e9;--noteline:#86baa7;
  --weekend:#eeeef3;--weekink:#65657a;--holiday:#f8e2e9;
  --holidayink:#874357;--alert:#f3aaa0;--green:#28734e
}
*{box-sizing:border-box}
body{margin:0;padding:18px 24px;background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif}
button,textarea,input{font:inherit}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.nav,.actions,.switch{display:flex;align-items:center;gap:8px}
h1{min-width:220px;text-align:center;font-size:1.45rem;margin:0}
.btn{height:40px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-weight:650;cursor:pointer}
.btn.primary,.switch button.active{background:var(--accent);color:#fffdf9;border-color:var(--accent)}
.switch{padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.switch button{height:34px;border:0;border-radius:7px;padding:0 14px;background:transparent;color:var(--muted);font-weight:700;cursor:pointer}
.calendar{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) 82px 82px;gap:8px}
.weekday{text-align:center;color:var(--muted);font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px}
.weekday:nth-child(n+6){color:var(--weekink)}
.cell{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px;aspect-ratio:1/.92;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.cell.today{border:2px solid var(--accent)}
.empty{background:transparent;border-color:transparent;cursor:default;aspect-ratio:auto}
.head{display:flex;align-items:center;position:relative;min-height:28px}
.num{font-weight:800;font-size:1.05rem}
.today .num{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fffdf9;font-size:.88rem}
.dow{margin-left:auto;color:var(--muted);font-size:.72rem}
.drop{position:absolute;left:50%;transform:translateX(-50%);width:24px;height:24px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--weekink);cursor:pointer}
.hero{display:flex;flex-direction:column;gap:5px;flex:1;min-height:0}
.job,.note{position:relative;flex:1;min-height:68px;border-radius:8px;padding:10px 36px 10px 11px;word-break:break-word;white-space:pre-wrap;overflow:hidden}
.job{background:var(--job);border:1px solid var(--jobline);font-size:1rem;font-weight:700}
.job.rain{background:var(--weekend);border-color:var(--line);color:var(--weekink)}
.note{background:var(--note);border:1px solid var(--noteline);font-size:.93rem}
.note.blink{background:var(--alert);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{background:#f8d6ce}}
.mini{position:absolute;right:5px;bottom:5px;width:25px;height:25px;border:1px solid var(--line);border-radius:6px;background:var(--paper);display:grid;place-items:center;cursor:pointer}
.map{color:var(--green);text-decoration:none}
.map.off{opacity:.35;pointer-events:none}
.bell{color:#286f5c}
.off-cell{justify-content:center;align-items:center;background:var(--weekend);color:var(--weekink);text-align:center;min-height:92px;padding:10px;cursor:default}
.holiday{background:var(--holiday);color:var(--holidayink);border-color:#e4b4c3}
.off-cell strong{font-size:.88rem}
.off-cell small{font-size:.68rem;margin-top:4px}

.modal-bg,.people-bg{position:fixed;inset:0;background:#0006;z-index:10;display:none;place-items:center}
.modal-bg.open,.people-bg.open{display:grid}
.modal{width:min(580px,94vw);max-height:90vh;overflow:auto;background:var(--paper);border-radius:16px;padding:26px;box-shadow:0 20px 60px #0003}
.modal h2{margin:0 0 18px}
.field{margin-bottom:14px}
.field label{display:block;color:var(--muted);font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.field textarea{width:100%;min-height:50px;resize:vertical;border:1px solid var(--jobline);border-radius:8px;background:var(--job);padding:9px;color:var(--ink)}
.peopleline{display:flex;align-items:center;gap:8px}
.editpeople{height:28px;border:1px solid var(--line);border-radius:6px;background:var(--paper);cursor:pointer}
.people{display:flex;flex-wrap:wrap;gap:8px}
.person{border:1px solid var(--line);border-radius:20px;background:var(--paper);padding:6px 13px;font-weight:650;cursor:pointer}
.person.selected{background:#bce5cf;border-color:var(--green);color:#17452e}
.close{background:var(--accent);color:#fffdf9;border:0;border-radius:8px;padding:10px 20px;font-weight:700;cursor:pointer}
.people-box{background:var(--paper);padding:22px;border-radius:14px;width:min(390px,92vw)}
.people-box h3{margin:0 0 12px}
.pmi{display:flex;gap:7px;margin:7px 0}
.pmi input{flex:1;padding:7px;border:1px solid var(--line);border-radius:6px}
.pmi button{border:0;background:transparent;cursor:pointer}
.addperson{display:flex;gap:7px;margin-top:12px}
.addperson input{flex:1;padding:8px;border:1px solid var(--line);border-radius:6px}
.status{position:fixed;left:18px;bottom:16px;color:var(--muted);font-size:.75rem}
.signin{position:fixed;inset:0;background:var(--bg);z-index:30;display:grid;place-items:center}
.signin-box{text-align:center;background:var(--paper);padding:30px;border-radius:16px;width:min(420px,92vw);box-shadow:0 12px 40px #0002}
.signin-box h2{margin:0 0 8px}
.signin-box p{color:var(--muted);margin:0 0 18px}
@media(max-width:900px){
  .row{grid-template-columns:repeat(5,minmax(0,1fr))}
  .row>*:nth-child(n+6){display:none}
}
@media(max-width:650px){
  body{padding:10px}
  .row{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
  .weekday:nth-child(n+3){display:none}
  .cell{aspect-ratio:auto;min-height:180px}
  h1{min-width:160px;font-size:1.15rem}
}
</style>
</head>

<body>
<div class="signin" id="signin">
  <div class="signin-box">
    <h2>Viola kalendář</h2>
    <p>Přihlas se svým Google účtem a otevři společný kalendář.</p>
    <button class="btn primary" id="login">Přihlásit přes Google</button>
  </div>
</div>

<header>
  <div class="nav">
    <button class="btn" id="prev">◂</button>
    <h1 id="title"></h1>
    <button class="btn" id="next">▸</button>
  </div>
  <div class="actions">
    <div class="switch">
      <button id="monthBtn">Měsíc</button>
      <button id="weekBtn">Týden</button>
    </div>
    <button class="btn primary" id="today">Dnes</button>
    <button class="btn" id="logout">Odhlásit</button>
  </div>
</header>

<main class="calendar" id="calendar"></main>
<div class="status" id="status">Připojuji…</div>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal"></div>
</div>

<div class="people-bg" id="peopleBg">
  <div class="people-box" id="peopleBox"></div>
</div>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  setDoc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBhIPfNupVde-9WGdjak7qvjigGNPgYI",
  authDomain: "viola-kalendar.firebaseapp.com",
  projectId: "viola-kalendar",
  storageBucket: "viola-kalendar.firebasestorage.app",
  messagingSenderId: "313947429240",
  appId: "1:313947429240:web:5684c85b52607765f3d08d"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const DAYS = ["Po","Út","St","Čt","Pá","So","Ne"];
const MONTHS = [
  "Leden","Únor","Březen","Duben","Květen","Červen",
  "Červenec","Srpen","Září","Říjen","Listopad","Prosinec"
];

const HOLIDAYS = {
  "2026-01-01":"Nový rok",
  "2026-04-03":"Velký pátek",
  "2026-04-06":"Velikonoční pondělí",
  "2026-05-01":"Svátek práce",
  "2026-05-08":"Den vítězství",
  "2026-07-05":"Cyril a Metoděj",
  "2026-07-06":"Jan Hus",
  "2026-09-28":"Den české státnosti",
  "2026-10-28":"Vznik ČSR",
  "2026-11-17":"Den svobody",
  "2026-12-24":"Štědrý den",
  "2026-12-25":"1. svátek vánoční",
  "2026-12-26":"2. svátek vánoční"
};

const DEFAULT_PEOPLE = [
  "Martin","Saša","Petr","Dan",
  "Doubravka","Veronika","Míša"
];

let data = {};
let people = [...DEFAULT_PEOPLE];
let view = "month";
let cursor = new Date();
let unsubscribe = null;
let currentModalKey = "";

const $ = id => document.getElementById(id);

function dateKey(date) {
  return [
    date.getFullYear(),
    String(date.getMonth()+1).padStart(2,"0"),
    String(date.getDate()).padStart(2,"0")
  ].join("-");
}

function read(key, field) {
  return data[key + "_" + field] || "";
}

async function write(key, field, value) {
  data[key + "_" + field] = value;
  $("status").textContent = "Ukládám…";

  await setDoc(
    doc(db, "calendar", key + "_" + field),
    {
      key,
      field,
      value,
      updatedAt: Date.now()
    }
  );

  $("status").textContent = "Synchronizováno";
}

function safe(text) {
  return String(text)
    .replace(/&/g,"&")
    .replace(/</g,"<")
    .replace(/>/g,">")
    .replace(/"/g,""");
}

function monday(date) {
  const d = new Date(date);
  const day = d.getDay();
  d.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
  return d;
}

function isToday(date) {
  return dateKey(date) === dateKey(new Date());
}

function mapUrl(address) {
  return "https://www.google.com/maps/search/" +
    encodeURIComponent(address);
}

function makeDay(date, weekdayIndex) {
  const key = dateKey(date);
  const holiday = HOLIDAYS[key];

  if (weekdayIndex > 4 || holiday) {
    const cell = document.createElement("div");
    cell.className = "cell off-cell " + (holiday ? "holiday" : "");
    cell.innerHTML =
      "<strong>" + date.getDate() + ". " + DAYS[weekdayIndex] + "</strong>" +
      "<small>" + (holiday ? "Volno, " + holiday : "Volno") + "</small>";
    return cell;
  }

  const address = read(key,"address");
  const rain = read(key,"off") === "1";
  const blinking = read(key,"blink") === "1";
  const note = read(key,"notes");

  const cell = document.createElement("div");
  cell.className = "cell" + (isToday(date) ? " today" : "");

  const label = rain ? "Volno/Déšť" : (address || "Zakázka");
  const map = address && !rain
    ? "<a class='mini map' href='" + mapUrl(address) +
      "' target='_blank' rel='noopener' onclick='event.stopPropagation()'>⌖</a>"
    : "";

  cell.innerHTML =
    "<div class='head'>" +
      "<span class='num'>" + date.getDate() + "</span>" +
      "<button class='drop' data-drop='" + key + "'>💧</button>" +
      "<span class='dow'>" + DAYS[weekdayIndex] + "</span>" +
    "</div>" +
    "<div class='hero'>" +
      "<div class='job " + (rain ? "rain" : "") + "'>" +
        safe(label) + map +
      "</div>" +
      "<div class='note " + (blinking ? "blink" : "") + "'>" +
        (note ? safe(note) : "<span style='color:var(--muted)'>Poznámka</span>") +
        "<button class='mini bell' data-bell='" + key + "'>🔔</button>" +
      "</div>" +
    "</div>";

  cell.addEventListener("click", event => {
    if (event.target.closest("button,a")) return;
    openDay(key,date,weekdayIndex);
  });

  return cell;
}

function render() {
  const root = $("calendar");
  root.innerHTML = "";

  $("monthBtn").classList.toggle("active", view === "month");
  $("weekBtn").classList.toggle("active", view === "week");

  if (view === "week") {
    const start = monday(new Date());
    const rowHead = document.createElement("div");
    rowHead.className = "row";

    DAYS.forEach(day => {
      rowHead.innerHTML += "<div class='weekday'>" + day + "</div>";
    });

    root.appendChild(rowHead);

    const row = document.createElement("div");
    row.className = "row";

    for (let i = 0; i < 7; i++) {
      const date = new Date(start);
      date.setDate(start.getDate() + i);
      row.appendChild(makeDay(date,i));
    }

    root.appendChild(row);
    $("title").textContent =
      start.toLocaleDateString("cs-CZ") + " až " +
      new Date(start.getFullYear(),start.getMonth(),start.getDate()+6)
        .toLocaleDateString("cs-CZ");

  } else {
    $("title").textContent =
      MONTHS[cursor.getMonth()] + " " + cursor.getFullYear();

    const head = document.createElement("div");
    head.className = "row";

    DAYS.forEach(day => {
      head.innerHTML += "<div class='weekday'>" + day + "</div>";
    });

    root.appendChild(head);

    const first = new Date(cursor.getFullYear(),cursor.getMonth(),1);
    const offset = (first.getDay() + 6) % 7;
    const total = new Date(cursor.getFullYear(),cursor.getMonth()+1,0).getDate();
    const days = [];

    for (let i=0; i<offset; i++) days.push(null);
    for (let i=1; i<=total; i++) {
      days.push(new Date(cursor.getFullYear(),cursor.getMonth(),i));
    }
    while (days.length % 7) days.push(null);

    for (let i=0; i<days.length; i+=7) {
      const row = document.createElement("div");
      row.className = "row";

      days.slice(i,i+7).forEach((date,index) => {
        row.appendChild(
          date ? makeDay(date,index) :
          Object.assign(document.createElement("div"),{className:"cell empty"})
        );
      });

      root.appendChild(row);
    }
  }

  bindButtons();
}

function bindButtons() {
  document.querySelectorAll("[data-drop]").forEach(button => {
    button.onclick = event => {
      event.stopPropagation();

      const key = button.dataset.drop;
      const current = read(key,"off") === "1";

      write(key,"off",current ? "0" : "1");
      render();
    };
  });

  document.querySelectorAll("[data-bell]").forEach(button => {
    button.onclick = event => {
      event.stopPropagation();

      const key = button.dataset.bell;
      const current = read(key,"blink") === "1";

      write(key,"blink",current ? "0" : "1");
      render();
    };
  });
}

function openDay(key,date,weekdayIndex) {
  currentModalKey = key;

  const fields = [
    ["address","Adresa"],
    ["work","Práce"],
    ["material","Materiál"],
    ["price","Cena"],
    ["notes","Poznámka"]
  ];

  let html =
    "<h2>" + date.toLocaleDateString("cs-CZ",{dateStyle:"full"}) + "</h2>";

  fields.forEach(([field,label]) => {
    html +=
      "<div class='field'>" +
        "<label>" + label + "</label>" +
        "<textarea data-field='" + field +
          "' spellcheck='false'>" + safe(read(key,field)) + "</textarea>" +
      "</div>";
  });

  html +=
    "<div class='field'>" +
      "<div class='peopleline'>" +
        "<label>Lidé</label>" +
        "<button class='editpeople' id='editPeople'>✏️</button>" +
      "</div>" +
      "<div class='people' id='peopleList'>";

  const selected = JSON.parse(read(key,"people") || "[]");

  people.forEach(person => {
    html +=
      "<button class='person " +
      (selected.includes(person) ? "selected" : "") +
      "' data-person='" + safe(person) + "'>" +
      safe(person) + "</button>";
  });

  html +=
      "</div>" +
    "</div>" +
    "<button class='close' id='closeDay'>Zavřít</button>";

  $("modal").innerHTML = html;
  $("modalBg").classList.add("open");

  $("modal").querySelectorAll("textarea").forEach(area => {
    area.oninput = () =>
      write(key,area.dataset.field,area.value);
  });

  $("modal").querySelectorAll("[data-person]").forEach(button => {
    button.onclick = () => {
      const list = JSON.parse(read(key,"people") || "[]");
      const person = button.dataset.person;
      const index = list.indexOf(person);

      if (index >= 0) list.splice(index,1);
      else list.push(person);

      write(key,"people",JSON.stringify(list));
      button.classList.toggle("selected");
    };
  });

  $("editPeople").onclick = openPeopleEditor;
  $("closeDay").onclick = closeModal;
}

function closeModal() {
  $("modalBg").classList.remove("open");
  render();
}

function openPeopleEditor() {
  let html = "<h3>Upravit seznam lidí</h3>";

  people.forEach((person,index) => {
    html +=
      "<div class='pmi'>" +
        "<input value='" + safe(person) + "' data-person-index='" + index + "'>" +
        "<button data-delete-person='" + index + "'>✕</button>" +
      "</div>";
  });

  html +=
    "<div class='addperson'>" +
      "<input id='newPerson' placeholder='Nové jméno'>" +
      "<button id='addPerson'>Přidat</button>" +
    "</div>" +
    "<button class='close' id='closePeople'>Hotovo</button>";

  $("peopleBox").innerHTML = html;
  $("peopleBg").classList.add("open");

  $("peopleBox").querySelectorAll("[data-person-index]").forEach(input => {
    input.onchange = () => {
      people[Number(input.dataset.personIndex)] = input.value.trim();
      write("_settings","people",JSON.stringify(people));
    };
  });

  $("peopleBox").querySelectorAll("[data-delete-person]").forEach(button => {
    button.onclick = () => {
      people.splice(Number(button.dataset.deletePerson),1);
      write("_settings","people",JSON.stringify(people));
      openPeopleEditor();
    };
  });

  $("addPerson").onclick = () => {
    const input = $("newPerson");
    const name = input.value.trim();

    if (name && !people.includes(name)) {
      people.push(name);
      write("_settings","people",JSON.stringify(people));
    }

    openPeopleEditor();
  };

  $("closePeople").onclick = () => {
    $("peopleBg").classList.remove("open");
  };
}

$("login").onclick = () =>
  signInWithPopup(auth,provider).catch(error => alert(error.message));

$("logout").onclick = () => signOut(auth);

$("monthBtn").onclick = () => {
  view = "month";
  cursor = new Date();
  render();
};

$("weekBtn").onclick = () => {
  view = "week";
  cursor = new Date();
  render();
};

$("prev").onclick = () => {
  if (view === "month") {
    cursor.setMonth(cursor.getMonth()-1);
  } else {
    cursor.setDate(cursor.getDate()-7);
  }
  render();
};

$("next").onclick = () => {
  if (view === "month") {
    cursor.setMonth(cursor.getMonth()+1);
  } else {
    cursor.setDate(cursor.getDate()+7);
  }
  render();
};

$("today").onclick = () => {
  cursor = new Date();
  view = "month";
  render();
};

onAuthStateChanged(auth,user => {
  if (!user) {
    $("signin").style.display = "grid";
    return;
  }

  $("signin").style.display = "none";

  if (unsubscribe) unsubscribe();

  unsubscribe = onSnapshot(
    collection(db,"calendar"),
    snapshot => {
      data = {};

      snapshot.forEach(item => {
        const value = item.data();
        data[value.key + "_" + value.field] = value.value;
      });

      const settings = data["_settings_people"];
      if (settings) {
        try {
          people = JSON.parse(settings);
        } catch {}
      }

      $("status").textContent = "Synchronizováno";
      render();
    },
    error => {
      $("status").textContent = "Chyba synchronizace";
      console.error(error);
    }
  );
});

render();
</script>
</body>
</html>
