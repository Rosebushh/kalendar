<style>
/* Credit line — bottom-right */
.design-ui-credit {
  position: fixed;
  bottom: 12px;
  right: 12px;
  font: 11px/1 system-ui, sans-serif;
  color: rgba(128,128,128,0.5);
  pointer-events: none;
  z-index: 2147483647;
  transition: opacity 0.4s ease;
  user-select: none;
  letter-spacing: 0.02em;
}

/* Hide chrome on touch devices */
@media (hover: none) {
  .design-ui-credit { display: none; }
}

/* Print fixes */
@media print {
  * {
    transition: none !important;
    animation: none !important;
    box-shadow: none !important;
  }
  body {
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }
  .design-ui-credit { display: none !important; }
}

</style>
<script>
(function () {
    // Design-ui pages are single compositions, so the whole body is editable.
    function markEditable() {
        document.body.classList.add('artifact-editable');
    }

    // Credit badge with idle-fade. Hover devices only.
    function initChromeUI() {
        if (!matchMedia('(hover: hover)').matches) return;

        var credit = document.createElement('div');
        credit.className = 'design-ui-credit';
        credit.setAttribute('aria-hidden', 'true');
        credit.innerHTML = '\u{1F49C} by ClickUp Brain';
        document.body.appendChild(credit);

        var timer = null;
        var fade = function (out) { credit.style.opacity = out ? '0' : ''; };
        fade(true);
        var show = function () {
            fade(false);
            clearTimeout(timer);
            timer = setTimeout(function () { fade(true); }, 3000);
        };
        document.addEventListener('mousemove', show);
        show();
    }

    function init() {
        markEditable();
        initChromeUI();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();

</script>

wrap:wrap;gap:8px}.person{border:1px solid var(--line);border-radius:20px;background:var(--paper);padding:6px 13px;font-weight:650}.person.selected{background:#bce5cf;border-color:var(--green);color:#17452e}.edit{height:28px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}.close{background:var(--accent);color:var(--paper);border:0;border-radius:8px;padding:10px 20px;font-weight:700}.peoplebox{background:var(--paper);padding:22px;border-radius:14px;width:min(390px,92vw)}.pmi{display:flex;gap:7px;margin:7px 0}.pmi input{flex:1;padding:7px;border:1px solid var(--line);border-radius:6px}.pmi button{border:0;background:transparent}.addperson{display:flex;gap:7px;margin-top:12px}.addperson input{flex:1;padding:8px;border:1px solid var(--line);border-radius:6px}.status{position:fixed;left:18px;bottom:16px;color:var(--muted);font-size:.75rem}.signin{position:fixed;inset:0;background:var(--bg);z-index:30;display:grid;place-items:center}.signinbox{text-align:center;background:var(--paper);padding:30px;border-radius:16px;width:min(420px,92vw);box-shadow:0 12px 40px #0002}.signinbox p{color:var(--muted);margin:0 0 18px}@media(max-width:650px){body{padding:10px}.row{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.weekday:nth-child(n+3){display:none}.cell{aspect-ratio:auto;min-height:180px}h1{min-width:160px;font-size:1.15rem}}

<script>
const firebaseConfig={apiKey:'AIzaSyBhIPfNupVde-9WGdjak7qvjigGNPyVI',authDomain:'viola-kalendar.firebaseapp.com',projectId:'viola-kalendar',storageBucket:'viola-kalendar.firebasestorage.app',messagingSenderId:'313947429240',appId:'1:313947429240:web:5684c85b52607765f3d08d'};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore(),provider=new firebase.auth.GoogleAuthProvider();
const $=id=>document.getElementById(id),D=['Po','Út','St','Čt','Pá','So','Ne'],MONTHS=['Leden','Únor','Březen','Duben','Květen','Červen','Červenec','Srpen','Září','Říjen','Listopad','Prosinec'];const HOL={'2026-01-01':'Nový rok','2026-04-03':'Velký pátek','2026-04-06':'Velikonoční pondělí','2026-05-01':'Svátek práce','2026-05-08':'Den vítězství','2026-07-05':'Cyril a Metoděj','2026-07-06':'Jan Hus','2026-09-28':'Den české státnosti','2026-10-28':'Vznik ČSR','2026-11-17':'Den svobody','2026-12-24':'Štědrý den','2026-12-25':'1. svátek vánoční','2026-12-26':'2. svátek vánoční'};const DEFAULT_PEOPLE=['Martin','Saša','Petr','Dan','Doubravka','Veronika','Míša'];let data={},people=[...DEFAULT_PEOPLE],view='month',cursor=new Date(),unsubscribe=null,currentKey='';
const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,read=(k,f)=>data[k+'_'+f]||'';async function write(k,f,v){data[k+'_'+f]=v;$('status').textContent='Ukládám…';try{await db.collection('calendar').doc(k+'_'+f).set({key:k,field:f,value:v,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});$('status').textContent='Synchronizováno'}catch(e){$('status').textContent='Chyba synchronizace';console.error(e)}}function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function monday(d){let x=new Date(d),n=x.getDay();x.setDate(x.getDate()-(n===0?6:n-1));return x}function isToday(d){return key(d)===key(new Date())}
function makeDay(d,wd){let k=key(d),h=HOL[k];if(wd>4||h){let e=document.createElement('div');e.className='cell off '+(h?'holiday':'');e.innerHTML=`<strong>${d.getDate()}. ${D[wd]}</strong><small>${h?'Volno, '+h:'Volno'}</small>`;return e}let a=read(k,'address'),rain=read(k,'off')==='1',blink=read(k,'blink')==='1',note=read(k,'notes'),e=document.createElement('div');e.className='cell'+(isToday(d)?' today':'');e.dataset.key=k;e.innerHTML=`<div class='head'><span class='num'>${d.getDate()}</span><button class='drop' data-drop>💧</button><span class='dow'>${D[wd]}</span></div><div class='hero'><div class='job ${rain?'rain':''}'>${esc(rain?'Volno/Déšť':a||'Zakázka')}${a&&!rain?`<a class='mini map' href='https://www.google.com/maps/search/${encodeURIComponent(a)}' target='_blank' rel='noopener' onclick='event.stopPropagation()'>⌖</a>`:''}</div><div class='note ${blink?'blink':''}'>${esc(note)||'<span style="color:var(--muted)">Poznámka</span>'}<button class='mini bell' data-bell>🔔</button></div></div>`;return e}
function render(){let root=$('calendar');root.innerHTML='';$('monthBtn').classList.toggle('active',view==='month');$('weekBtn').classList.toggle('active',view==='week');let dates=[];if(view==='week'){let s=monday(new Date),e=new Date(s);e.setDate(e.getDate()+6);$('title').textContent=`${s.toLocaleDateString('cs-CZ')} až ${e.toLocaleDateString('cs-CZ')}`;for(let i=0;i<7;i++){let d=new Date(s);d.setDate(d.getDate()+i);dates.push(d)}}else{$('title').textContent=`${MONTHS[cursor.getMonth()]} ${cursor.getFullYear()}`;let f=new Date(cursor.getFullYear(),cursor.getMonth(),1),off=(f.getDay()+6)%7,total=new Date(cursor.getFullYear(),cursor.getMonth()+1,0).getDate();for(let i=0;i<off;i++)dates.push(null);for(let i=1;i<=total;i++)dates.push(new Date(cursor.getFullYear(),cursor.getMonth(),i));while(dates.length%7)dates.push(null)}let h=document.createElement('div');h.className='row';D.forEach(n=>h.innerHTML+=`<div class='weekday'>${n}</div>`);root.appendChild(h);for(let i=0;i<dates.length;i+=7){let r=document.createElement('div');r.className='row';dates.slice(i,i+7).forEach((d,j)=>r.appendChild(d?makeDay(d,j):Object.assign(document.createElement('div'),{className:'cell empty'})));root.appendChild(r)}bind()}
function bind(){document.querySelectorAll('.cell[data-key]').forEach(c=>c.onclick=e=>{if(e.target.closest('button,a'))return;let d=new Date(c.dataset.key+'T00:00:00');openDay(c.dataset.key,d)});document.querySelectorAll('[data-drop]').forEach(b=>b.onclick=e=>{e.stopPropagation();let k=b.closest('.cell').dataset.key;write(k,'off',read(k,'off')==='1'?'0':'1');render()});document.querySelectorAll('[data-bell]').forEach(b=>b.onclick=e=>{e.stopPropagation();let k=b.closest('.cell').dataset.key;write(k,'blink',read(k,'blink')==='1'?'0':'1');render()})}
function openDay(k,d){currentKey=k;let selected=JSON.parse(read(k,'people')||'[]'),h=`<h2>${d.toLocaleDateString('cs-CZ',{dateStyle:'full'})}</h2>`;[['address','Adresa'],['work','Práce'],['material','Materiál'],['price','Cena'],['notes','Poznámka']].forEach(([f,l])=>h+=`<div class='field'><label>${l}</label><textarea data-field='${f}' spellcheck='false'>${esc(read(k,f))}</textarea></div>`);h+=`<div class='field'><div class='peopleline'><label>Lidé</label><button class='edit' id='editPeople'>✏️</button></div><div class='people'>${people.map(n=>`<button class='person ${selected.includes(n)?'selected':''}' data-person='${esc(n)}'>${esc(n)}</button>`).join('')}</div></div><button class='close' id='closeDay'>Zavřít</button>`;$('dayModal').innerHTML=h;$('dayOverlay').classList.add('open');$('dayModal').querySelectorAll('textarea').forEach(t=>t.oninput=()=>write(k,t.dataset.field,t.value));$('dayModal').querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{let l=JSON.parse(read(k,'people')||'[]'),i=l.indexOf(b.dataset.person);i>=0?l.splice(i,1):l.push(b.dataset.person);write(k,'people',JSON.stringify(l));b.classList.toggle('selected')});$('closeDay').onclick=closeDay;$('editPeople').onclick=openPeopleEditor}
function closeDay(){$('dayOverlay').classList.remove('open');render()}
function openPeopleEditor(){let h='<h3>Upravit seznam lidí</h3>';people.forEach((n,i)=>h+=`<div class='pmi'><input value='${esc(n)}' data-i='${i}'><button data-del='${i}'>✕</button></div>`);h+=`<div class='addperson'><input id='newPerson' placeholder='Nové jméno'><button id='addPerson'>Přidat</button></div><button class='close' id='closePeople'>Hotovo</button>`;$('peopleBox').innerHTML=h;$('peopleOverlay').classList.add('open');$('peopleBox').querySelectorAll('[data-i]').forEach(i=>i.onchange=()=>{people[+i.dataset.i]=i.value.trim()||people[+i.dataset.i];write('_settings','people',JSON.stringify(people))});$('peopleBox').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{people.splice(+b.dataset.del,1);write('_settings','people',JSON.stringify(people));openPeopleEditor()});$('addPerson').onclick=()=>{let v=$('newPerson').value.trim();if(v&&!people.includes(v)){people.push(v);write('_settings','people',JSON.stringify(people))}openPeopleEditor()};$('closePeople').onclick=()=>{$('peopleOverlay').classList.remove('open');openDay(currentKey,new Date(currentKey+'T00:00:00'))}}
$('login').onclick=()=>auth.signInWithPopup(provider).catch(e=>alert(e.message));$('logout').onclick=()=>auth.signOut();$('monthBtn').onclick=()=>{view='month';cursor=new Date();render()};$('weekBtn').onclick=()=>{view='week';cursor=new Date();render()};$('prev').onclick=()=>{if(view==='month')cursor.setMonth(cursor.getMonth()-1);else cursor.setDate(cursor.getDate()-7);render()};$('next').onclick=()=>{if(view==='month')cursor.setMonth(cursor.getMonth()+1);else cursor.setDate(cursor.getDate()+7);render()};$('todayBtn').onclick=()=>{cursor=new Date();view='month';render()};auth.onAuthStateChanged(u=>{if(!u){$('signin').style.display='grid';return}$('signin').style.display='none';if(unsubscribe)unsubscribe();unsubscribe=db.collection('calendar').onSnapshot(s=>{data={};s.forEach(x=>{let v=x.data();data[v.key+'_'+v.field]=v.value});let p=data['_settings_people'];if(p)try{people=JSON.parse(p)}catch(e){}$('status').textContent='Synchronizováno';render()},e=>{$('status').textContent='Chyba synchronizace';console.error(e)})});render();
</script></body></html>
